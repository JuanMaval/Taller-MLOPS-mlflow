# Cubierta Forestal MLOps · docker compose
#
#   s1 mlflow-db   PostgreSQL  <--->  s2 MLflow        (experiments, runs, registry metadata)
#   s3 MinIO                   <--->  s2 MLflow        (artifacts: models, metrics, plots)
#   s4 Jupyter                 <--->  s2 MLflow        (logs runs, registers models)
#   s4 Jupyter                 <--->  s5 postgres      (training reads the business DB)
#   s6 Inference API           <--->  s2 MLflow        (loads the registered model to serve)
#
# Two isolated Postgres instances, each with its own volume:
#   - mlflow-db : MLflow backend store only (internal, not published to the host)
#   - postgres  : business database read by Jupyter
#
# Jupyter and the Inference API are built from the same Dockerfile / uv.lock
# (targets `jupyter` and `api`) so the model serialised in training can be
# deserialised in serving with identical library versions.

name: cubierta-forestal

x-mlflow-client-env: &mlflow-client-env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  # Artifacts are proxied by the server (--serve-artifacts), so clients only
  # need the tracking URI. The S3 variables are kept so direct access to the
  # bucket also works from a notebook when needed.
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin

services:
  # ------------------------------------------------------------------------- #
  # s5 · PostgreSQL (business database)
  # ------------------------------------------------------------------------- #
  postgres:
    image: postgres:16
    container_name: cf-postgres
    environment:
      POSTGRES_DB: cubierta_forestal
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Optional schema/seed .sql files, applied once on an empty volume
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
      # Custom-format pg_dump restored by init/002_restore_backup.sh
      - ./services/postgres/backup:/backup:ro
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "app", "-d", "cubierta_forestal" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # s1 · PostgreSQL (MLflow backend store, internal to the stack, own volume)
  # ------------------------------------------------------------------------- #
  mlflow-db:
    image: postgres:16
    container_name: cf-mlflow-db
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "mlflow", "-d", "mlflow" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # s3 · MinIO (artifact store for MLflow)
  #
  # Chainguard build of MinIO (MinIO removed its own public images in 2026-09).
  # Distroless-style image: runs as uid 65532, ships `minio` and `mc` only.
  # ------------------------------------------------------------------------- #
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: cf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # One-shot: MinIO does not create buckets on start. Reuse the same image
  # (it ships `mc`) to create the MLflow artifact bucket before the server
  # comes up.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: cf-minio-init
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/mlflow
        echo "bucket ready: mlflow"
    depends_on:
      minio:
        condition: service_healthy

  # ------------------------------------------------------------------------- #
  # s2 · MLflow (tracking server + model registry)
  #
  # Backend store: mlflow-db. Artifacts: MinIO bucket `mlflow`, proxied through
  # the server so clients never need bucket credentials.
  # ------------------------------------------------------------------------- #
  mlflow:
    build:
      context: ./services/mlflow
    image: cubierta-forestal-mlflow:0.1.0
    container_name: cf-mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg2://mlflow:mlflow@mlflow-db:5432/mlflow
      - --artifacts-destination
      - s3://mlflow
      - --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "5000:5000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/health', timeout=4)" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      mlflow-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # s4 · Jupyter (training: reads postgres, logs runs and models to MLflow)
  # ------------------------------------------------------------------------- #
  jupyter:
    build:
      context: .
      target: jupyter
    image: cubierta-forestal-jupyter:0.1.0
    container_name: cf-jupyter
    ports:
      - "8888:8888"
    environment:
      <<: *mlflow-client-env
      JUPYTER_TOKEN: cubierta
      DATA_DB_HOST: postgres
      DATA_DB_PORT: "5432"
      DATA_DB_NAME: cubierta_forestal
      DATA_DB_USER: app
      DATA_DB_PASSWORD: app
    volumes:
      # Bind mounts to iterate without rebuilding the image
      - ./services/jupyter/notebooks:/workspace/notebooks
      - ./services/inference-api/src:/workspace/src
      - ./services/inference-api/pyproject.toml:/workspace/pyproject.toml
      - ./services/inference-api/uv.lock:/workspace/uv.lock
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # s6 · Inference API (serves the model registered in MLflow)
  # ------------------------------------------------------------------------- #
  inference-api:
    build:
      context: .
      target: api
    image: cubierta-forestal-api:0.1.0
    container_name: cf-inference-api
    ports:
      - "8000:8000"
    environment:
      <<: *mlflow-client-env
      MODEL_NAME: cubierta-forestal
      # Registry alias resolved at startup: models:/<MODEL_NAME>@<MODEL_ALIAS>
      MODEL_ALIAS: production
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
    name: cubierta_forestal_postgres
  mlflow-db-data:
    name: cubierta_forestal_mlflow_db
  minio-data:
    name: cubierta_forestal_minio
